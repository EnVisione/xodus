[graph]
all-features = true

[advisories]
# These advisories remain only in the pinned external XAL dependency chain.
# The workspace h2 0.4 path is locked to 0.4.16 or newer, and the workspace
# uses rustls-webpki 0.103.13 or newer. XAL still pins reqwest 0.11 and its
# h2 0.3 and rustls-webpki 0.101 transitive versions. Remove these entries
# when XAL publishes a compatible dependency update.
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "Only h2 0.3.27 through the pinned external XAL reqwest 0.11 chain remains; the workspace h2 0.4 path is 0.4.16." },
    { id = "RUSTSEC-2026-0098", reason = "Only rustls-webpki 0.101.7 through the pinned external XAL reqwest 0.11 chain remains; the workspace path is 0.103.13." },
    { id = "RUSTSEC-2026-0099", reason = "Only rustls-webpki 0.101.7 through the pinned external XAL reqwest 0.11 chain remains; the workspace path is 0.103.13." },
    { id = "RUSTSEC-2026-0104", reason = "Only rustls-webpki 0.101.7 through the pinned external XAL reqwest 0.11 chain remains; the workspace path is 0.103.13." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled only by the pinned GTK3 desktop stack used by the current tao and wry UI dependencies; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0412", reason = "gdk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0413", reason = "atk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0415", reason = "gtk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
