[graph]
all-features = true

[advisories]
# These advisories remain only in the pinned GTK3 desktop stack.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled only by the pinned GTK3 desktop stack used by the current tao and wry UI dependencies; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0412", reason = "gdk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0413", reason = "atk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0415", reason = "gtk is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11 is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys is pulled only by the pinned GTK3 desktop stack used by tao and wry; no safe upgrade is available." },
]

[bans]
# Duplicate versions are reviewed but are retained where platform support,
# pinned external APIs, or incompatible major versions require them.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/xodus-gaming/ntfs.git",
]
