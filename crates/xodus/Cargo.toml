[package]
name = "xodus"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
xal = { path = "../../vendor/xal", version = "0.1.3" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { workspace = true }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
log = "0.4.34"
chrono = { workspace = true }
base64 = { workspace = true }
rand = "0.10.2"
uuid = { workspace = true }
aes = "0.9.2"
keyring-core = { version = "1.0.0", features = ["sample"] }
zerocopy = { version = "0.8.56", features = ["derive"] }
bergshamra-c14n = "0.8.0"
hmac = "0.13.0"
sha2 = "0.11.0"
cbc = "0.2.1"
url = "2.5.8"
aes-keywrap = "0.9.0"
num_enum = "0.7.6"
prost = "0.14.4"
globset = "0.4.20"
num-bigint-dig = "0.9.1"
num-integer = "0.1.47"
zeroize = "1.8.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
smbios-lib = "0.9.4"
bergshamra = { version = "0.8.0", default-features = false, features = ["aws-lc"] }
kryptering = { version = "0.5.0", default-features = false, features = ["aws-lc"] }

[target.'cfg(target_os = "linux")'.dependencies]
bergshamra = { version = "0.8.0", default-features = false, features = ["aws-lc"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-openssl"]}
kryptering = { version = "0.5.0", default-features = false, features = ["aws-lc"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"]}

[dev-dependencies]
ed25519-dalek = "3.0.0"

[build-dependencies]
prost-build = "0.14.4"

[features]
key-chain-file = []
