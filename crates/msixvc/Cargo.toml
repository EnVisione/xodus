[package]
name = "msixvc"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
msixvc-common = { path = "../msixvc-common", version = "0.1.0" }

tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = "0.11.0"
aes = "0.9.2"
bitflags = "2.13.1"
bytes = "1.12.1"
chrono = { workspace = true }
futures-util = "0.3.33"
gpt = "4.1.0"
ntfs = "0.4.0"
num_enum = "0.7.6"
thiserror = "2.0.19"
tokio-util = { version = "0.7.19", features = ["io-util"] }
typenum = { version = "1.20.1", features = ["const-generics"] }
uuid = "1.24.0"
zerocopy = { version = "0.8.55", features = ["derive"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
