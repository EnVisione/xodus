[package]
name = "xodus-cli"
version = "0.1.0"
edition = "2024"
default-run = "xodus-cli"
license.workspace = true

[dependencies]
xodus = { path = "../xodus", version = "0.1.0" }
msixvc = { path = "../msixvc", version = "0.1.0" }
base64 = { workspace = true }
sha2 = "0.11.0"
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
log = "0.4.34"
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
tao = "0.37.0"
wry = "0.56.1"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
chrono = { workspace = true }
inquire = "0.9.4"
futures-util = "0.3.34"
uuid = { workspace = true }
indicatif = "0.18.6"
fs2 = "0.4.3"
tempfile = "3.27.0"
rustix = "1.1.4"
ctrlc = "3.5.2"
nix = "0.31.3"

[dev-dependencies]
aws-lc-rs = { version = "1.19.0", features = ["ring-io"] }
msixvc-common = { path = "../msixvc-common", version = "0.1.0" }

[features]
tokio_console = ["dep:console-subscriber"]
