[package]
name = "xodus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
aws-lc-rs = { version = "1.19.0", features = ["ring-io"] }
libfuzzer-sys = "0.4.13"
msixvc = { path = "../crates/msixvc" }
msixvc-common = { path = "../crates/msixvc-common" }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt"] }

[patch.crates-io]
ntfs = { git = "https://github.com/xodus-gaming/ntfs.git", rev = "5edc794c3ec73a2722dad24abefd05f270d3e066" }

[[bin]]
name = "parse_inputs"
path = "fuzz_targets/parse_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authenticated_xvd"
path = "fuzz_targets/authenticated_xvd.rs"
test = false
doc = false
bench = false
